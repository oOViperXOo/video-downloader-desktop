name: Linux and macOS builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: posix-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
            architecture: x64
          - target: macos-arm64
            runner: macos-15
            architecture: arm64
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: requirements-posix.lock
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2 xvfb xauth libegl1 libgl1 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0
      - name: macOS system dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install ffmpeg aria2
      - name: Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-posix.lock pytest==9.1.1
          mkdir -p test-output test-temp
      - name: Regression tests
        run: .venv/bin/python -m pytest -q --junitxml=test-output/tests.xml --basetemp=test-temp/ci
      - name: Build native bundle
        run: bash build.sh
      - name: Verify embedded application sources
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            binary='dist/Orvanta Video Downloader.app/Contents/MacOS/OrvantaVideoDownloader'
          else
            binary=dist/OrvantaVideoDownloader/OrvantaVideoDownloader
          fi
          .venv/bin/python tools/verify_embedded_sources.py "$binary"
      - name: Create distribution package
        run: .venv/bin/python tools/package_posix.py
      - name: Verify extracted Linux package
        if: runner.os == 'Linux'
        run: xvfb-run -a .venv/bin/python tools/verify_posix_release.py
      - name: Verify mounted macOS package
        if: runner.os == 'macOS'
        run: .venv/bin/python tools/verify_posix_release.py
      - name: Upload verified packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Orvanta-${{ matrix.target }}
          path: dist/release-output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tests-${{ matrix.target }}
          path: test-output/
          retention-days: 7

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify tag matches application version
        env:
          TAG: ${{ github.ref_name }}
        run: python -c 'import os; from release_updates import APP_VERSION; assert os.environ["TAG"] == "v" + APP_VERSION'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: Orvanta-*
          path: packages
          merge-multiple: true
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" packages/* --verify-tag --draft \
            --title "Orvanta Video Downloader ${TAG#v}" \
            --notes 'Linux x64 and macOS Apple Silicon builds. macOS is ad-hoc signed, not Developer ID signed or notarized. Review before publishing; Windows packages are built separately.'
